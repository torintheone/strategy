name: Сборка

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  test:
    name: Тесты и проверка данных
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Тесты (xUnit)
        run: dotnet test Politeconomy.sln --configuration Release
      - name: Проверка данных
        run: dotnet run --project src/Politeconomy.Tools --configuration Release -- validate
      - name: Прогон мира на 50 лет без графики
        run: |
          set -o pipefail
          dotnet run --project src/Politeconomy.Tools --configuration Release -- check --years 50 2>&1 | tee check-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: check-report
          path: check-report.txt

  windows:
    name: Сборка для Windows
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Кэш Godot и шаблонов экспорта
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono

      - name: Скачать Godot ${{ env.GODOT_VERSION }} (.NET)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/

      - name: Найти исполняемый файл Godot
        run: |
          godot="$(find ~/godot -type f -name 'Godot_v*_mono_linux*x86_64' | head -1)"
          chmod +x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"

      - name: Сборка C# и импорт ресурсов
        run: |
          dotnet build game/Politeconomy.Game.csproj
          "$GODOT" --headless --path game --import

      - name: Дымовой тест (игра запускается без окна и проходит все режимы карты)
        run: |
          set -o pipefail
          "$GODOT" --headless --path game -- --smoke 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log
          if grep -E "Unhandled exception|System\.[A-Za-z.]*Exception|SCRIPT ERROR" smoke.log; then exit 1; fi

      - name: Экспорт Windows-версии
        run: |
          set -euo pipefail
          mkdir -p build/Politeconomy
          "$GODOT" --headless --path game --export-release "Windows Desktop" "$GITHUB_WORKSPACE/build/Politeconomy/Politeconomy.exe"
          test -f build/Politeconomy/Politeconomy.exe
          cp -r data build/Politeconomy/data
          cp README.md LICENSES-ASSETS.md CHANGELOG.md build/Politeconomy/
          ls -la build/Politeconomy

      - uses: actions/upload-artifact@v4
        with:
          name: Politeconomy-windows
          path: build/Politeconomy

      - name: Архив для релиза
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd build && zip -qr "Politeconomy-${GITHUB_REF_NAME}-windows.zip" Politeconomy

      - name: Выложить в Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Politeconomy-${{ github.ref_name }}-windows.zip
          body: |
            Сборка для Windows 10/11 (64-bit). Распакуйте архив целиком и запустите Politeconomy.exe.
            Что изменилось и что проверить — в CHANGELOG.md внутри архива.
