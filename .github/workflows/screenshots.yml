name: Скриншоты

# Запускает игру с настоящей графикой (виртуальный экран и программный OpenGL), снимает несколько видов
# и кладёт PNG в ветку «<ветка>-screens». Так видно, как выглядит игра, без ручного запуска.
on:
  push:
    branches: ["**"]
    paths:
      - game/**
      - src/Politeconomy.Sim/**
      - data/**
      - .github/workflows/screenshots.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  shots:
    name: Снять скриншоты
    if: ${{ !endsWith(github.ref_name, '-screens') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Кэш Godot и шаблонов экспорта
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono

      - name: Скачать Godot ${{ env.GODOT_VERSION }} (.NET)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/

      - name: Найти исполняемый файл Godot
        run: |
          godot="$(find ~/godot -type f -name 'Godot_v*_mono_linux*x86_64' | head -1)"
          chmod +x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"

      - name: Виртуальный экран и OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 mesa-utils > /dev/null

      - name: Сборка C# и импорт ресурсов
        run: |
          dotnet build game/Politeconomy.Game.csproj
          "$GODOT" --headless --path game --import

      - name: Снять скриншоты
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/shots"
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$GODOT" --path game --rendering-driver opengl3 --resolution 1920x1080 --position 0,0 \
            -- --screenshots "$RUNNER_TEMP/shots" 2>&1 | tee shots.log
          ls -la "$RUNNER_TEMP/shots"
          test "$(ls "$RUNNER_TEMP/shots" | wc -l)" -ge 8

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots

      - name: Сохранить в ветку «-screens»
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          branch="${GITHUB_REF_NAME}-screens"
          cd "$RUNNER_TEMP/shots"
          git init -q -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Скриншоты для ${sha}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
